          cat > app_src/lib/screens/chat_screen.dart <<'BARTA_EOF'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:flutter/material.dart';

          import '../services/data.dart';
          import '../services/notifier.dart';

          class ChatScreen extends StatefulWidget {
            final String friendId;
            final String friendName;
            const ChatScreen(
                {super.key, required this.friendId, required this.friendName});

            @override
            State<ChatScreen> createState() => _ChatScreenState();
          }

          class _ChatScreenState extends State<ChatScreen> {
            final _input = TextEditingController();
            late final String _me = FirebaseAuth.instance.currentUser!.uid;
            late final String _chatId = chatIdOf(_me, widget.friendId);
            bool _ready = false;
            String? _error;
            bool _sending = false;

            @override
            void initState() {
              super.initState();
              Notifier.instance.openChatId = _chatId;
              _open();
            }

            Future<void> _open() async {
              try {
                final ref = db.collection('chats').doc(_chatId);
                final snap = await ref.get();
                final members = [_me, widget.friendId]..sort();
                if (!snap.exists) {
                  await ref.set({
                    'members': members,
                    'createdAt': FieldValue.serverTimestamp(),
                  });
                } else {
                  final old = List<String>.from(snap.data()?['members'] ?? const []);
                  if (!old.contains(_me) || !old.contains(widget.friendId)) {
                    throw StateError('Chat membership could not be verified.');
                  }
                }
                if (mounted) setState(() => _ready = true);
              } catch (e) {
                if (mounted) {
                  setState(() => _error = e is StateError ? e.message : errorText(e));
                }
              }
            }

            @override
            void dispose() {
              if (Notifier.instance.openChatId == _chatId) {
                Notifier.instance.openChatId = null;
              }
              _input.dispose();
              super.dispose();
            }

            Future<void> _send() async {
              var text = _input.text.trim();
              if (text.isEmpty) return;
              if (text.length > 2000) text = text.substring(0, 2000);
              setState(() => _sending = true);
              try {
                await db.collection('chats').doc(_chatId).collection('messages').add({
                  'senderId': _me,
                  'text': text,
                  'createdAt': FieldValue.serverTimestamp(),
                });
                _input.clear();
              } catch (e) {
                if (mounted) {
                  ScaffoldMessenger.of(context)
                      .showSnackBar(SnackBar(content: Text(errorText(e))));
                }
              } finally {
                if (mounted) setState(() => _sending = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF100C1D),
                  title: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(widget.friendName, style: const TextStyle(fontSize: 17)),
                      const Text('Private conversation',
                          style: TextStyle(fontSize: 12, color: Color(0xFFAFA3C3))),
                    ],
                  ),
                ),
                body: Column(
                  children: [
                    Expanded(child: _body()),
                    SafeArea(
                      top: false,
                      child: Padding(
                        padding: const EdgeInsets.fromLTRB(10, 6, 10, 8),
                        child: Row(
                          children: [
                            Expanded(
                              child: TextField(
                                controller: _input,
                                maxLength: 2000,
                                maxLines: 4,
                                minLines: 1,
                                buildCounter: (_,
                                        {required currentLength,
                                        required isFocused,
                                        maxLength}) =>
                                    null,
                                decoration:
                                    const InputDecoration(hintText: 'Write a message...'),
                              ),
                            ),
                            const SizedBox(width: 8),
                            IconButton.filled(
                              onPressed: (_ready && !_sending) ? _send : null,
                              icon: const Icon(Icons.send),
                            ),
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget _body() {
              if (_error != null) {
                return Center(
                    child: Padding(
                        padding: const EdgeInsets.all(20),
                        child: Text(_error!,
                            style: const TextStyle(color: Color(0xFFFF9DA9)))));
              }
              if (!_ready) return const Center(child: CircularProgressIndicator());
              return StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                stream: db
                    .collection('chats')
                    .doc(_chatId)
                    .collection('messages')
                    .orderBy('createdAt', descending: true)
                    .snapshots(),
                builder: (context, snap) {
                  if (snap.hasError) {
                    return Center(child: Text(errorText(snap.error!)));
                  }
                  if (!snap.hasData) {
                    return const Center(child: CircularProgressIndicator());
                  }
                  final docs = snap.data!.docs;
                  if (docs.isEmpty) {
                    return const Center(
                        child: Text('No messages yet. Say hello! 👋',
                            style: TextStyle(color: Color(0xFFAFA3C3))));
                  }
                  return ListView.builder(
                    reverse: true, // newest message at the bottom
                    padding: const EdgeInsets.all(12),
                    itemCount: docs.length,
                    itemBuilder: (context, i) {
                      final m = docs[i].data();
                      final mine = m['senderId'] == _me;
                      final ts = (m['createdAt'] as Timestamp?)?.toDate();
                      final time = ts == null
                          ? 'Sending...'
                          : TimeOfDay.fromDateTime(ts).format(context);
                      return Align(
                        alignment: mine ? Alignment.centerRight : Alignment.centerLeft,
                        child: Container(
                          margin: const EdgeInsets.symmetric(vertical: 4),
                          padding:
                              const EdgeInsets.symmetric(horizontal: 13, vertical: 10),
                          constraints: BoxConstraints(
                              maxWidth: MediaQuery.of(context).size.width * 0.82),
                          decoration: BoxDecoration(
                            color: mine
                                ? const Color(0xFF7044D8)
                                : const Color(0xFF292039),
                            borderRadius: BorderRadius.circular(16),
                          ),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Text((m['text'] as String?) ?? ''),
                              const SizedBox(height: 5),
                              Text(time,
                                  style: const TextStyle(fontSize: 11, color: Colors.white70)),
                            ],
                          ),
                        ),
                      );
                    },
                  );
                },
              );
            }
          }
          BARTA_EOF
          cat > app_src/tools/patch_android.py <<'BARTA_EOF'
          """Patches the freshly generated Flutter android/ folder for Barta.

          - adds INTERNET + POST_NOTIFICATIONS permissions, sets app label "Barta"
          - sets minSdk 24
          - enables core library desugaring (needed by flutter_local_notifications)
          """
          import pathlib
          import re
          import sys

          android = pathlib.Path("android")

          # ---- manifest -------------------------------------------------------------
          mf = android / "app/src/main/AndroidManifest.xml"
          t = mf.read_text()
          add = ""
          for p in ("INTERNET", "POST_NOTIFICATIONS"):
              if f"android.permission.{p}" not in t:
                  add += f'    <uses-permission android:name="android.permission.{p}"/>\n'
          t = t.replace("<application", add + "    <application", 1)
          t = re.sub(r'android:label="[^"]*"', 'android:label="Barta"', t, count=1)
          mf.write_text(t)

          # ---- gradle ---------------------------------------------------------------
          kts = android / "app/build.gradle.kts"
          groovy = android / "app/build.gradle"
          if kts.exists():
              g, is_kts = kts, True
          elif groovy.exists():
              g, is_kts = groovy, False
          else:
              sys.exit("No app/build.gradle(.kts) found")

          s = g.read_text()
          s, n = re.subn(r"minSdk(Version)?\s*=?\s*flutter\.minSdkVersion", "minSdk = 24", s)
          if n == 0:
              print("warning: minSdk line not found, leaving as is")

          flag = ("isCoreLibraryDesugaringEnabled = true" if is_kts
                  else "coreLibraryDesugaringEnabled true")
          s, n = re.subn(r"(compileOptions\s*\{)", r"\1\n        " + flag, s, count=1)
          if n == 0:
              sys.exit("compileOptions block not found; cannot enable desugaring")

          dep = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                 if is_kts else
                 "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
          s += f"\ndependencies {{\n    {dep}\n}}\n"
          g.write_text(s)
          print("Patched", mf, "and", g)
          BARTA_EOF

      - name: Generate Android scaffold (package com.shadowchat.app)
        run: |
          flutter create --platforms=android --org com.shadowchat --project-name app "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" app_src/android

      - name: Patch Android project
        working-directory: app_src
        run: python3 tools/patch_android.py

      - name: Get packages
        working-directory: app_src
        run: flutter pub get

      - name: Build APK
        working-directory: app_src
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Barta-Native-APK
          path: app_src/build/app/outputs/flutter-apk/app-release.apk
