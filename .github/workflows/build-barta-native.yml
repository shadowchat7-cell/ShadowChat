          cat > app_src/lib/services/data.dart <<'BARTA_EOF'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';

          final db = FirebaseFirestore.instance;

          /// Same chat id rule as the website: both uids sorted and joined by "_".
          String chatIdOf(String a, String b) => ([a, b]..sort()).join('_');

          /// Same behaviour as the website's saveUserProfile (keeps old username).
          Future<String> saveUserProfile(User user, {String requested = ''}) async {
            final ref = db.collection('users').doc(user.uid);
            final snap = await ref.get();
            final old = (snap.data()?['username'] as String?) ?? '';
            var name = requested.trim().isNotEmpty
                ? requested.trim()
                : (old.isNotEmpty ? old : (user.displayName ?? 'ShadowUser'));
            if (name.length > 24) name = name.substring(0, 24);
            final data = <String, dynamic>{
              'username': name,
              'updatedAt': FieldValue.serverTimestamp(),
            };
            if (!snap.exists) data['createdAt'] = FieldValue.serverTimestamp();
            await ref.set(data, SetOptions(merge: true));
            return name;
          }

          String errorText(Object e) {
            final code = (e is FirebaseException) ? e.code : '';
            const map = {
              'invalid-email': 'Email address is not valid.',
              'email-already-in-use': 'An account with this email already exists.',
              'weak-password': 'Password must be at least 6 characters.',
              'invalid-credential': 'Wrong email or password.',
              'wrong-password': 'Wrong email or password.',
              'user-not-found': 'Wrong email or password.',
              'network-request-failed': 'Check your internet connection.',
              'permission-denied': 'Permission denied. Check Firestore rules.',
            };
            if (map.containsKey(code)) return map[code]!;
            if (e is FirebaseException && e.message != null) return e.message!;
            return 'Something went wrong. Please try again.';
          }
          BARTA_EOF
          cat > app_src/lib/services/notifier.dart <<'BARTA_EOF'
          import 'dart:async';

          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';

          import 'data.dart';

          /// Shows a notification when a friend sends a message in a chat that is not
          /// currently open. Works while the app process is alive (foreground or
          /// background). Notifications after the app is fully closed need FCM + a
          /// server (see README).
          class Notifier {
            Notifier._();
            static final instance = Notifier._();

            final _plugin = FlutterLocalNotificationsPlugin();
            String? openChatId;
            StreamSubscription? _friendsSub;
            final Map<String, StreamSubscription> _chatSubs = {};

            Future<void> init() async {
              const android = AndroidInitializationSettings('@mipmap/ic_launcher');
              await _plugin.initialize(const InitializationSettings(android: android));
            }

            Future<void> start(String myUid) async {
              stop();
              await _plugin
                  .resolvePlatformSpecificImplementation<
                      AndroidFlutterLocalNotificationsPlugin>()
                  ?.requestNotificationsPermission();

              _friendsSub = db
                  .collection('friends')
                  .doc(myUid)
                  .collection('contacts')
                  .snapshots()
                  .listen((snap) {
                final current = <String, String>{};
                for (final d in snap.docs) {
                  final data = d.data();
                  final id = (data['friendId'] as String?) ?? d.id;
                  current[id] = (data['username'] as String?) ?? 'ShadowUser';
                }
                for (final id in _chatSubs.keys.toList()) {
                  if (!current.containsKey(id)) _chatSubs.remove(id)?.cancel();
                }
                current.forEach((id, name) {
                  if (!_chatSubs.containsKey(id)) _watch(myUid, id, name);
                });
              }, onError: (_) {});
            }

            void _watch(String me, String friendId, String name) {
              final chatId = chatIdOf(me, friendId);
              var first = true;
              _chatSubs[friendId] = db
                  .collection('chats')
                  .doc(chatId)
                  .collection('messages')
                  .orderBy('createdAt', descending: true)
                  .limit(1)
                  .snapshots()
                  .listen((snap) {
                if (first) {
                  first = false;
                  return;
                }
                for (final ch in snap.docChanges) {
                  if (ch.type != DocumentChangeType.added) continue;
                  final d = ch.doc.data();
                  if (d == null || d['senderId'] == me) continue;
                  if (openChatId == chatId) continue;
                  _show(name, (d['text'] as String?) ?? '', chatId.hashCode);
                }
              }, onError: (_) {});
            }

            Future<void> _show(String title, String body, int id) {
              const details = NotificationDetails(
                android: AndroidNotificationDetails(
                  'messages',
                  'Messages',
                  channelDescription: 'New message alerts',
                  importance: Importance.high,
                  priority: Priority.high,
                ),
              );
              return _plugin.show(id, title, body, details);
            }

            void stop() {
              _friendsSub?.cancel();
              _friendsSub = null;
              for (final s in _chatSubs.values) {
                s.cancel();
              }
              _chatSubs.clear();
              openChatId = null;
            }
          }
          BARTA_EOF
          cat > app_src/lib/screens/auth_screen.dart <<'BARTA_EOF'
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:flutter/material.dart';

          import '../services/data.dart';

          class AuthScreen extends StatefulWidget {
            const AuthScreen({super.key});

            @override
            State<AuthScreen> createState() => _AuthScreenState();
          }

          class _AuthScreenState extends State<AuthScreen> {
            final _email = TextEditingController();
            final _password = TextEditingController();
            final _username = TextEditingController();
            bool _signup = false;
            bool _busy = false;
            String _status = '';

            @override
            void dispose() {
              _email.dispose();
              _password.dispose();
              _username.dispose();
              super.dispose();
            }

            Future<void> _submit() async {
              final email = _email.text.trim();
              final password = _password.text;
              final username = _username.text.trim();
              if (email.isEmpty || password.isEmpty) {
                setState(() => _status = 'Enter email and password.');
                return;
              }
              if (_signup && username.isEmpty) {
                setState(() => _status = 'Enter a username too.');
                return;
              }
              setState(() {
                _busy = true;
                _status = 'Please wait...';
              });
              try {
                final auth = FirebaseAuth.instance;
                if (_signup) {
                  final r = await auth.createUserWithEmailAndPassword(
                      email: email, password: password);
                  await saveUserProfile(r.user!, requested: username);
                } else {
                  await auth.signInWithEmailAndPassword(email: email, password: password);
                }
              } catch (e) {
                if (mounted) setState(() => _status = errorText(e));
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              final cs = Theme.of(context).colorScheme;
              return Scaffold(
                body: SafeArea(
                  child: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(20),
                      child: ConstrainedBox(
                        constraints: const BoxConstraints(maxWidth: 480),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            const Text('👻 Barta',
                                style: TextStyle(
                                    fontSize: 34,
                                    fontWeight: FontWeight.w800,
                                    color: Color(0xFFB99AFF))),
                            const SizedBox(height: 6),
                            const Text('Your identity. Your conversations.',
                                style: TextStyle(color: Color(0xFFAFA3C3))),
                            const SizedBox(height: 22),
                            Text(_signup ? 'Create account' : 'Login',
                                style: Theme.of(context).textTheme.headlineSmall),
                            const SizedBox(height: 14),
                            if (_signup) ...[
                              TextField(
                                controller: _username,
                                maxLength: 24,
                                decoration:
                                    const InputDecoration(hintText: 'Choose a username'),
                              ),
                              const SizedBox(height: 4),
                            ],
                            TextField(
                              controller: _email,
                              keyboardType: TextInputType.emailAddress,
                              autofillHints: const [AutofillHints.email],
                              decoration:
                                  const InputDecoration(hintText: 'Email address'),
                            ),
                            const SizedBox(height: 12),
                            TextField(
                              controller: _password,
                              obscureText: true,
                              onSubmitted: (_) => _busy ? null : _submit(),
                              decoration: const InputDecoration(hintText: 'Password'),
                            ),
                            const SizedBox(height: 16),
                            FilledButton(
                              onPressed: _busy ? null : _submit,
                              child: Padding(
                                padding: const EdgeInsets.symmetric(vertical: 12),
                                child: Text(_signup ? 'Sign Up' : 'Login'),
                              ),
                            ),
                            const SizedBox(height: 8),
                            TextButton(
                              onPressed: _busy
                                  ? null
                                  : () => setState(() {
                                        _signup = !_signup;
                                        _status = '';
                                      }),
                              child: Text(_signup
                                  ? 'Already have an account? Login'
                                  : 'Create account'),
                            ),
                            const SizedBox(height: 8),
                            Text(_status,
                                textAlign: TextAlign.center,
                                style: TextStyle(
                                    color: _status.isEmpty || _status == 'Please wait...'
                                        ? cs.primary
                                        : const Color(0xFFFF9DA9))),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          BARTA_EOF
          cat > app_src/lib/screens/home_screen.dart <<'BARTA_EOF'
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          import '../services/data.dart';
          import '../services/notifier.dart';
          import 'chat_screen.dart';

          String _initialOf(String s) =>
              s.isEmpty ? '?' : String.fromCharCode(s.runes.first).toUpperCase();

          class HomeScreen extends StatefulWidget {
            final User user;
            const HomeScreen({super.key, required this.user});

            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            String _name = '';

            @override
            void initState() {
              super.initState();
              _init();
            }

            Future<void> _init() async {
              try {
                final name = await saveUserProfile(widget.user);
                if (mounted) setState(() => _name = name);
              } catch (_) {}
              Notifier.instance.start(widget.user.uid);
            }

            String get _initial =>
                _initialOf(_name.isNotEmpty ? _name : (widget.user.email ?? ''));

            Future<void> _logout() async {
              Notifier.instance.stop();
              await FirebaseAuth.instance.signOut();
            }

            void _openProfile() {
              final uid = widget.user.uid;
              final messenger = ScaffoldMessenger.of(context);
              showModalBottomSheet(
                context: context,
                backgroundColor: const Color(0xFF191326),
                builder: (ctx) => SafeArea(
                  child: Padding(
                    padding: const EdgeInsets.all(20),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.stretch,
                      children: [
                        Center(
                          child: CircleAvatar(
                            radius: 32,
                            backgroundColor: const Color(0xFF7044D8),
                            child: Text(_initial,
                                style: const TextStyle(
                                    fontSize: 28,
                                    fontWeight: FontWeight.bold,
                                    color: Colors.white)),
                          ),
                        ),
                        const SizedBox(height: 10),
                        Text(_name.isEmpty ? 'ShadowUser' : _name,
                            textAlign: TextAlign.center,
                            style: Theme.of(ctx).textTheme.titleLarge),
                        const SizedBox(height: 18),
                        const Text('Your ID',
                            style: TextStyle(color: Color(0xFFAFA3C3), fontSize: 13)),
                        const SizedBox(height: 4),
                        SelectableText(uid),
                        const SizedBox(height: 10),
                        OutlinedButton.icon(
                          icon: const Icon(Icons.copy, size: 18),
                          label: const Text('Copy My ID'),
                          onPressed: () async {
                            await Clipboard.setData(ClipboardData(text: uid));
                            if (ctx.mounted) Navigator.of(ctx).pop();
                            messenger.showSnackBar(
                                const SnackBar(content: Text('ID copied')));
                          },
                        ),
                        const SizedBox(height: 8),
                        FilledButton.icon(
                          style: FilledButton.styleFrom(
                              backgroundColor: const Color(0xFF4A2638),
                              foregroundColor: Colors.white),
                          icon: const Icon(Icons.logout, size: 18),
                          label: const Text('Log out'),
                          onPressed: () {
                            Navigator.of(ctx).pop();
                            _logout();
                          },
                        ),
                      ],
                    ),
                  ),
                ),
              );
            }

            void _openSearch() {
              showModalBottomSheet(
                context: context,
                isScrollControlled: true,
                backgroundColor: const Color(0xFF191326),
                builder: (_) => _SearchSheet(myUid: widget.user.uid),
              );
            }

            @override
            Widget build(BuildContext context) {
              final uid = widget.user.uid;
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF100C1D),
                  titleSpacing: 16,
                  title: Row(
                    children: [
                      const Text('Barta 👻'),
                      const SizedBox(width: 12),
                      GestureDetector(
                        onTap: _openProfile,
                        child: CircleAvatar(
                          radius: 17,
                          backgroundColor: const Color(0xFF7044D8),
                          child: Text(_initial,
                              style: const TextStyle(
                                  fontWeight: FontWeight.bold,
                                  color: Colors.white,
                                  fontSize: 16)),
                        ),
                      ),
                    ],
                  ),
                  actions: [
                    IconButton(
                        tooltip: 'Search friend',
                        icon: const Icon(Icons.search),
                        onPressed: _openSearch),
                  ],
                ),
                body: StreamBuilder<QuerySnapshot<Map<String, dynamic>>>(
                  stream: db
                      .collection('friends')
                      .doc(uid)
                      .collection('contacts')
                      .snapshots(),
                  builder: (context, snap) {
                    if (snap.hasError) {
                      return Center(child: Text(errorText(snap.error!)));
                    }
                    if (!snap.hasData) {
                      return const Center(child: CircularProgressIndicator());
                    }
                    final docs = snap.data!.docs;
                    if (docs.isEmpty) {
                      return const Center(
                        child: Padding(
                          padding: EdgeInsets.all(24),
                          child: Text(
                            'No chats yet.\nTap the search button above and enter your friend\'s ID.',
                            textAlign: TextAlign.center,
                            style: TextStyle(color: Color(0xFFAFA3C3)),
                          ),
                        ),
                      );
                    }
                    return ListView(
                      padding: const EdgeInsets.all(12),
                      children: [for (final d in docs) _FriendTile(doc: d)],
                    );
                  },
                ),
              );
            }
          }

          class _FriendTile extends StatelessWidget {
            final QueryDocumentSnapshot<Map<String, dynamic>> doc;
            const _FriendTile({required this.doc});

            @override
            Widget build(BuildContext context) {
              final data = doc.data();
              final id = (data['friendId'] as String?) ?? doc.id;
              final fallback = (data['username'] as String?) ?? 'ShadowUser';
              return StreamBuilder<DocumentSnapshot<Map<String, dynamic>>>(
                stream: db.collection('users').doc(id).snapshots(),
                builder: (context, snap) {
                  final name = (snap.data?.data()?['username'] as String?) ?? fallback;
                  return Card(
                    color: const Color(0xFF241B36),
                    child: ListTile(
                      leading: CircleAvatar(
                        backgroundColor: const Color(0xFF7044D8),
                        child: Text(_initialOf(name),
                            style: const TextStyle(
                                color: Colors.white, fontWeight: FontWeight.bold)),
                      ),
                      title: Text(name),
                      subtitle: Text(id,
                          maxLines: 1,
                          overflow: TextOverflow.ellipsis,
                          style: const TextStyle(fontSize: 11)),
                      trailing: const Icon(Icons.chevron_right),
                      onTap: () => Navigator.of(context).push(MaterialPageRoute(
                          builder: (_) => ChatScreen(friendId: id, friendName: name))),
                    ),
                  );
                },
              );
            }
          }

          class _SearchSheet extends StatefulWidget {
            final String myUid;
            const _SearchSheet({required this.myUid});

            @override
            State<_SearchSheet> createState() => _SearchSheetState();
          }

          class _SearchSheetState extends State<_SearchSheet> {
            final _ctrl = TextEditingController();
            bool _busy = false;
            String _status = '';
            bool _error = false;
            String? _foundId;
            String _foundName = '';
            bool _already = false;

            @override
            void dispose() {
              _ctrl.dispose();
              super.dispose();
            }

            void _set(String msg, [bool error = false]) {
              if (!mounted) return;
              setState(() {
                _status = msg;
                _error = error;
              });
            }

            Future<void> _search() async {
              final id = _ctrl.text.trim();
              setState(() => _foundId = null);
              if (id.isEmpty) return _set('Paste your friend\'s ID.', true);
              if (id == widget.myUid) return _set('That is your own ID.', true);
              setState(() => _busy = true);
              _set('Searching...');
              try {
                final snap = await db.collection('users').doc(id).get();
                if (!snap.exists) {
                  _set('ID not found. Check it again.', true);
                  return;
                }
                final contact = await db
                    .collection('friends')
                    .doc(widget.myUid)
                    .collection('contacts')
                    .doc(id)
                    .get();
                if (!mounted) return;
                setState(() {
                  _foundId = id;
                  _foundName = (snap.data()?['username'] as String?) ?? 'ShadowUser';
                  _already = contact.exists;
                  _status = '';
                });
              } catch (e) {
                _set(errorText(e), true);
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }

            Future<void> _add() async {
              final id = _foundId;
              if (id == null) return;
              final messenger = ScaffoldMessenger.of(context);
              final navigator = Navigator.of(context);
              setState(() => _busy = true);
              try {
                await db
                    .collection('friends')
                    .doc(widget.myUid)
                    .collection('contacts')
                    .doc(id)
                    .set({
                  'friendId': id,
                  'username': _foundName,
                  'addedAt': FieldValue.serverTimestamp(),
                });
                navigator.pop();
                messenger.showSnackBar(
                    SnackBar(content: Text('$_foundName added to your chats')));
              } catch (e) {
                _set(errorText(e), true);
              } finally {
                if (mounted) setState(() => _busy = false);
              }
            }

            @override
            Widget build(BuildContext context) {
              return SingleChildScrollView(
                padding: EdgeInsets.fromLTRB(
                    20, 20, 20, 20 + MediaQuery.of(context).viewInsets.bottom),
                child: SafeArea(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.stretch,
                    children: [
                      const Text('Find a friend',
                          style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 12),
                      Row(
                        children: [
                          Expanded(
                            child: TextField(
                              controller: _ctrl,
                              autofocus: true,
                              onSubmitted: (_) => _busy ? null : _search(),
                              decoration:
                                  const InputDecoration(hintText: 'Friend\'s user ID'),
                            ),
                          ),
                          const SizedBox(width: 8),
                          IconButton.filled(
                            tooltip: 'Search',
                            onPressed: _busy ? null : _search,
                            icon: const Icon(Icons.search),
                          ),
                        ],
                      ),
                      if (_status.isNotEmpty)
                        Padding(
                          padding: const EdgeInsets.only(top: 10),
                          child: Text(_status,
                              style: TextStyle(
                                  color: _error
                                      ? const Color(0xFFFF9DA9)
                                      : const Color(0xFFC6B4FF))),
                        ),
                      if (_foundId != null)
                        Card(
                          color: const Color(0xFF241B36),
                          margin: const EdgeInsets.only(top: 14),
                          child: ListTile(
                            leading: CircleAvatar(
                              backgroundColor: const Color(0xFF7044D8),
                              child: Text(_initialOf(_foundName),
                                  style: const TextStyle(
                                      color: Colors.white, fontWeight: FontWeight.bold)),
                            ),
                            title: Text(_foundName),
                            subtitle: Text(_foundId!,
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                style: const TextStyle(fontSize: 11)),
                            trailing: _already
                                ? const Text('Already added')
                                : FilledButton(
                                    onPressed: _busy ? null : _add,
                                    child: const Text('Add')),
                          ),
                        ),
                    ],
                  ),
                ),
              );
            }
          }
