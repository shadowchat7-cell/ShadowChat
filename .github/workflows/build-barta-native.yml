name: Build Barta Native APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write project files
        run: |
          mkdir -p app_src/lib/screens app_src/lib/services app_src/tools
          cat > app_src/pubspec.yaml <<'BARTA_EOF'
          name: app
          description: Barta - native ShadowChat app
          publish_to: none
          version: 1.0.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^3.8.0
            firebase_auth: ^5.3.4
            cloud_firestore: ^5.5.1
            flutter_local_notifications: ^18.0.1

          flutter:
            uses-material-design: true
          BARTA_EOF
          cat > app_src/lib/firebase_options.dart <<'BARTA_EOF'
