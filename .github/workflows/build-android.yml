
name: Build Barta Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Barta project
        run: |
          mkdir barta-build
          cd barta-build
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Barta com.shadowchat.app --web-dir=www
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1">
          </head>
          <body>
            <script>
              window.location.replace("https://shadowchat7-cell.github.io/ShadowChat/");
            </script>
          </body>
          </html>
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd barta-build/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Barta APK
        uses: actions/upload-artifact@v4
        with:
          name: Barta-Android-APK
          path: barta-build/android/app/build/outputs/apk/debug/app-debug.apk
