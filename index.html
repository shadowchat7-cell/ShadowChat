<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShadowChat</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #09070f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 400px;
      padding: 28px;
      text-align: center;
    }

    .logo { font-size: 55px; margin-bottom: 8px; }
    h1 { color: #bb86fc; margin-bottom: 8px; }
    .subtitle { color: #aaa2b5; margin-bottom: 32px; }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #40334f;
      border-radius: 12px;
      background: #17121f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus { border-color: #bb86fc; }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      background: #9b5de5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; }

    .secondary {
      background: #21172d;
      border: 1px solid #7044a1;
    }

    #message, #friendMessage {
      color: #d5baff;
      margin-top: 18px;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 28px;
      color: #80778b;
      font-size: 12px;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main class="app">
    <div class="logo">👻</div>
    <h1>ShadowChat</h1>
    <p class="subtitle">Your identity. Your conversations.</p>

    <form id="loginForm">
      <input id="username" type="text"
        placeholder="Choose your username"
        maxlength="24" required>

      <input id="email" type="email"
        placeholder="Enter your email" required>

      <input id="password" type="password"
        placeholder="Create a password"
        minlength="8" required>

      <button id="signupButton" type="submit">
        Create Account
      </button>
    </form>

    <button class="secondary" id="loginButton" type="button">
      I already have an account
    </button>

    <p id="message" role="status"></p>

    <p class="note" id="note">
      Chat with friends using your unique ID.
    </p>

    <section id="homeScreen" hidden>
      <h2>Welcome to ShadowChat 👻</h2>
      <p>Your Private ID</p>

      <input id="myPrivateId" type="text" readonly
        aria-label="Your private ID">

      <button id="copyIdButton" type="button">
        Copy My ID
      </button>

      <hr style="border-color:#40334f; margin:28px 0">

      <h3>Add a Friend</h3>

      <input id="friendId" type="text"
        placeholder="Enter friend's Private ID"
        autocomplete="off">

      <button id="findFriendButton" type="button">
        Find Friend
      </button>

      <p id="friendMessage" role="status"></p>

      <button id="addFriendButton" type="button" hidden>
        Add Friend
      </button>

      <button id="logoutButton" class="secondary" type="button">
        Log Out
      </button>
    </section>
  </main>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      updateProfile,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    // Apne Firebase project ki existing config
    const firebaseConfig = {
      apiKey: "AIzaSyAw_a17iZm1wpo8rp_-f47xV96FD43HeyM",
      authDomain: "shadowchat-57872.firebaseapp.com",
      projectId: "shadowchat-57872",
      storageBucket: "shadowchat-57872.firebasestorage.app",
      messagingSenderId: "905071947496",
      appId: "1:905071947496:web:a71ac0d2891ecf1824e35d"
    };

    // Firebase ko sirf ek baar initialize karein
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const signupButton = document.getElementById("signupButton");
    const message = document.getElementById("message");
    const note = document.getElementById("note");

    const homeScreen = document.getElementById("homeScreen");
    const myPrivateId = document.getElementById("myPrivateId");
    const copyIdButton = document.getElementById("copyIdButton");
    const logoutButton = document.getElementById("logoutButton");

    const friendMessage = document.getElementById("friendMessage");
    const friendIdInput = document.getElementById("friendId");
    const findFriendButton = document.getElementById("findFriendButton");
    const addFriendButton = document.getElementById("addFriendButton");

    let busy = false;
    let foundFriend = null;

    async function saveUserProfile(user, username) {
      await setDoc(doc(db, "users", user.uid), {
        username: username,
        createdAt: serverTimestamp()
      }, { merge: true });
    }

    function showHome(user) {
      form.hidden = true;
      loginButton.hidden = true;
      note.hidden = true;
      homeScreen.hidden = false;

      myPrivateId.value = user.uid;

      homeScreen.querySelector("h2").textContent =
        "Welcome, " + (user.displayName || "friend") + " 👻";

      message.textContent = "";
    }

    function showLogin() {
      form.hidden = false;
      loginButton.hidden = false;
      note.hidden = false;
      homeScreen.hidden = true;
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        showHome(user);
      } else {
        showLogin();
      }
    }, (error) => {
      message.textContent = "Auth error: " + error.message;
    });

    // Sign up
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;

      const username =
        document.getElementById("username").value.trim();
      const email =
        document.getElementById("email").value.trim();
      const password =
        document.getElementById("password").value;

      if (!username || !email || !password) {
        message.textContent = "Please fill in every field.";
        return;
      }

      busy = true;
      signupButton.disabled = true;
      message.textContent = "Creating account...";

      try {
        const result = await createUserWithEmailAndPassword(
          auth, email, password
        );

        await updateProfile(result.user, {
          displayName: username
        });

        await saveUserProfile(result.user, username);
        showHome(result.user);

      } catch (error) {
        console.error("Signup error:", error);
        message.textContent =
          "Signup failed: " + error.code + " — " + error.message;
      } finally {
        busy = false;
        signupButton.disabled = false;
      }
    });

    // Log in
    loginButton.addEventListener("click", async () => {
      if (busy) return;

      const email =
        document.getElementById("email").value.trim();
      const password =
        document.getElementById("password").value;

      if (!email || !password) {
        message.textContent =
          "Enter your email and password to log in.";
        return;
      }

      busy = true;
      loginButton.disabled = true;
      message.textContent = "Logging in...";

      try {
        const result = await signInWithEmailAndPassword(
          auth, email, password
        );

        await saveUserProfile(
          result.user,
          result.user.displayName || "friend"
        );

        showHome(result.user);

      } catch (error) {
        console.error("Login error:", error);
        message.textContent =
          "Login failed: " + error.code + " — " + error.message;
      } finally {
        busy = false;
        loginButton.disabled = false;
      }
    });

    // Copy Private ID
    copyIdButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(myPrivateId.value);
        friendMessage.textContent = "Private ID copied!";
      } catch (error) {
        myPrivateId.focus();
        myPrivateId.select();
        friendMessage.textContent =
          "Select your ID and copy it manually.";
      }
    });

    // Log out
    logoutButton.addEventListener("click", async () => {
      try {
        await signOut(auth);
        friendMessage.textContent = "";
        foundFriend = null;
        addFriendButton.hidden = true;
        message.textContent = "You have logged out.";
      } catch (error) {
        message.textContent = "Logout failed: " + error.message;
      }
    });

    // Find friend by Private ID
    findFriendButton.addEventListener("click", async () => {
      const friendId = friendIdInput.value.trim();

      foundFriend = null;
      addFriendButton.hidden = true;

      if (!auth.currentUser) {
        friendMessage.textContent = "Please log in first.";
        return;
      }

      if (!friendId) {
        friendMessage.textContent = "Enter your friend's Private ID.";
        return;
      }

      if (friendId === auth.currentUser.uid) {
        friendMessage.textContent = "You cannot add yourself!";
        return;
      }

      friendMessage.textContent = "Searching...";
      findFriendButton.disabled = true;

      try {
        const profile = await getDoc(doc(db, "users", friendId));

        if (!profile.exists()) {
          friendMessage.textContent =
            "Friend not found. Ask them to log in to ShadowChat first.";
          return;
        }

        const data = profile.data();

        foundFriend = {
          uid: friendId,
          username: data.username || "ShadowChat user"
        };

        friendMessage.textContent = "Found: " + foundFriend.username;
        addFriendButton.hidden = false;

      } catch (error) {
        console.error("Friend search error:", error);
        friendMessage.textContent =
          "Search failed: " + error.code + " — " + error.message;
      } finally {
        findFriendButton.disabled = false;
      }
    });

    // Add friend to the current user's contacts
    addFriendButton.addEventListener("click", async () => {
      const currentUser = auth.currentUser;

      if (!currentUser || !foundFriend) {
        friendMessage.textContent = "Find a friend first.";
        return;
      }

      addFriendButton.disabled = true;

      try {
        await setDoc(
          doc(db, "friends", currentUser.uid, "contacts", foundFriend.uid),
          {
            friendId: foundFriend.uid,
            username: foundFriend.username,
            addedAt: serverTimestamp()
          }
        );

        friendMessage.textContent =
          foundFriend.username + " added as a friend!";
        addFriendButton.hidden = true;

      } catch (error) {
        console.error("Add friend error:", error);
        friendMessage.textContent =
          "Could not add friend: " + error.code + " — " + error.message;
      } finally {
        addFriendButton.disabled = false;
      }
    });
  </script>
</body>
</html>
